<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LILA Monday Queue</title>
  <!-- Slice 2: priority logic. Only basic readability styling; the design comes in a later slice. -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 900px; line-height: 1.4; }
    .ticket { border: 1px solid #ccc; padding: 8px 10px; margin: 8px 0; }
    .case { border-left: 4px solid #999; padding-left: 8px; margin: 12px 0; }
    .linked { margin-left: 24px; }
    .muted { color: #666; }
    ul { margin: 4px 0; padding-left: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>LILA Monday Queue</h1>
    <label>
      Today:
      <input type="date" id="today-picker">
    </label>
    <span id="today-label"></span>
  </header>

  <p id="data-checks"></p>
  <p id="hidden-note" class="muted"></p>

  <main id="queue"></main>

<script>
// ---------------------------------------------------------------------------
// TICKET DATA
// Copy of tickets.csv. Browsers block fetch() on file://, so the CSV lives
// here as a string. If you edit tickets.csv, paste the new text here too.
// ---------------------------------------------------------------------------
const TICKETS_CSV = `ticket_id,opened,customer,country,delivered,firmware,issue,status,last_reply_from,last_reply_date,notes
T-101,2026-09-28,Maya Okafor,CA,2026-08-25,2.4.1,"Cycle stops halfway since the last update. Third time writing in. Wants a full refund.",open,customer,2026-10-03,"Two earlier tickets were closed with 'restart the unit'."
T-102,2026-10-01,Daniel Reyes,US,2026-09-12,2.4.1,"Unit pauses mid-cycle and the light blinks amber.",open,customer,2026-10-01,
T-103,2026-10-02,Priya Nair,CA,2026-09-20,2.4.1,"Stops after about an hour. Worked fine before the update.",open,customer,2026-10-02,
T-104,2026-09-24,Tom Lindqvist,US,2026-09-22,2.3.0,"Box arrived crushed and the lid is cracked. Photos attached.",waiting on us,customer,2026-09-24,"Carrier claim not filed yet."
T-105,2026-09-18,Grace Chen,CA,2026-09-01,2.3.0,"Sent the unit back for a refund. Tracking shows it reached the warehouse on Sep 26.",waiting on warehouse,us,2026-09-27,"Warehouse has not confirmed receipt. Refund on hold."
T-106,2026-10-03,Samir Haddad,CA,2026-10-01,2.4.1,"Cannot connect to Wi-Fi during setup.",open,customer,2026-10-03,
T-107,2026-10-02,Lena Fischer,US,2026-09-30,2.4.0,"Would like an onboarding call this week.",open,customer,2026-10-02,
T-108,2026-09-29,Andre Baptiste,CA,2026-09-10,2.3.0,"Changed his mind and wants a refund. Needs a return label.",open,customer,2026-09-29,
T-109,2026-09-30,Maya Okafor,CA,2026-08-25,2.4.1,"Following up on my refund request. Nobody has answered.",open,customer,2026-09-30,
T-110,2026-09-25,Hannah Brooks,US,2026-08-30,2.3.0,"Was promised a replacement by Sep 26. Still no tracking number.",waiting on us,us,2026-09-26,"Replacement unit not allocated yet."
T-111,2026-10-04,Oliver Grant,CA,2026-09-05,2.4.0,"Loves it. Asks how to order a second unit for his parents.",open,customer,2026-10-04,
T-112,2026-10-01,Sofia Marino,US,2026-09-27,2.4.0,"Amber light is blinking. Unit seems to run normally.",open,customer,2026-10-01,`;

// The scenario date. "Today" starts here, not on the real clock.
const DEFAULT_TODAY = "2026-10-05";

// ---------------------------------------------------------------------------
// CSV PARSER
// Reads the text one character at a time so quoted fields can hold commas,
// line breaks and apostrophes. A doubled quote ("") inside quotes means one ".
// Returns an array of rows; each row is an array of strings ("" when empty).
// ---------------------------------------------------------------------------
function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } // escaped quote
      else if (ch === '"') { inQuotes = false; }                    // closing quote
      else { field += ch; }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ",") {
      row.push(field); field = "";
    } else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;                 // Windows line end
      row.push(field); rows.push(row);
      row = []; field = "";
    } else {
      field += ch;
    }
  }
  // Last line has no line break after it.
  if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }

  // Drop fully blank lines.
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ""));
}

// Turns parsed rows into objects keyed by the header names.
// Missing trailing fields become "" so nothing ever shows "undefined".
function rowsToTickets(rows) {
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(cells => {
    const ticket = {};
    headers.forEach((name, i) => { ticket[name] = (cells[i] ?? "").trim(); });
    return ticket;
  });
}

// ---------------------------------------------------------------------------
// DATE HELPERS
// All dates are plain calendar dates in local time, built from year, month
// and day parts. Never use new Date("YYYY-MM-DD"): it is read as UTC and can
// land on the previous day.
// ---------------------------------------------------------------------------
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// Builds a date from parts. month is 1-12. Day overflow rolls over (Sep 31 -> Oct 1).
function makeDate(year, month, day) {
  return new Date(year, month - 1, day);
}

// "2026-10-05" -> Date, or null if the text is not a real calendar date.
function parseIsoDate(text) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec((text || "").trim());
  if (!match) return null;
  const [year, month, day] = [Number(match[1]), Number(match[2]), Number(match[3])];
  const date = makeDate(year, month, day);
  // Reject dates like 2026-02-31 that roll over into the next month.
  if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
  return date;
}

// Date -> "2026-10-05" (the format the date picker uses).
function toIsoDate(date) {
  const pad = n => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

// Date -> "Monday, Oct 5, 2026".
function formatLongDate(date) {
  return `${WEEKDAYS[date.getDay()]}, ${MONTHS[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
}

// Date -> "Oct 5".
function formatShortDate(date) {
  return `${MONTHS[date.getMonth()]} ${date.getDate()}`;
}

// Date -> "Mon Oct 5".
function formatDayDate(date) {
  return `${WEEKDAYS[date.getDay()].slice(0, 3)} ${formatShortDate(date)}`;
}

// A whole-day counter that ignores clock changes, used to compare and subtract dates.
function dayNumber(date) {
  return Math.round(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
}

function addDays(date, days) {
  return makeDate(date.getFullYear(), date.getMonth() + 1, date.getDate() + days);
}

// Calendar days from one date to another (negative if "to" is earlier).
function daysBetween(from, to) {
  return dayNumber(to) - dayNumber(from);
}

// Business days are Monday to Friday. Holidays are ignored.
function isBusinessDay(date) {
  const weekday = date.getDay();
  return weekday >= 1 && weekday <= 5;
}

// The first business day after a date (Fri, Sat or Sun -> Monday).
function nextBusinessDay(date) {
  let day = addDays(date, 1);
  while (!isBusinessDay(day)) day = addDays(day, 1);
  return day;
}

// Business days after "start", up to and including "end".
function businessDaysAfter(start, end) {
  let count = 0;
  for (let day = addDays(start, 1); dayNumber(day) <= dayNumber(end); day = addDays(day, 1)) {
    if (isBusinessDay(day)) count++;
  }
  return count;
}

// "1 day", "6 days".
function plural(count, word) {
  return `${count} ${word}${count === 1 ? "" : "s"}`;
}

// ---------------------------------------------------------------------------
// TEXT PATTERNS
// The words the rules look for in the issue and notes. Edit these to tune
// what counts as, say, damage or stalling. \b means "whole word".
// ---------------------------------------------------------------------------
const PATTERNS = {
  refund:          /\brefunds?\b/i,
  damage:          /\b(crushed|cracked|damaged|dented|broken|smashed)\b/i,
  carrierClaim:    /\bcarrier claim\b/i,
  claimFiled:      /\bclaim (?:was |has been |is )?filed\b/i,               // "claim not filed" does NOT match
  returnStarted:   /\b(sent (?:the unit|it) back|reached the warehouse|return label sent|unit returned)\b/i,
  stalling:        /\b(stops?|stopped|stopping|pauses?|paused|pausing|stalls?|stalled|stalling)\b|\bsince the (?:last )?update\b/i,
  earlierTickets:  /\b(\w+) earlier tickets?\b/i,                           // "Two earlier tickets"
  internalStep:    /\b(replacement|refund|repair|return)\b(?: unit)? not (allocated|shipped|approved|issued|processed)\b/i,
  promise:         /\bpromised (?:a |an |the )?([a-z ]+?) by (?:[a-z]+,? )?([a-z]{3})[a-z]*\.? (\d{1,2})\b/i, // "promised a replacement by Sep 26"
  blockedStatus:   /^waiting on (warehouse|carrier|engineering)$/i,
};

const NUMBER_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
const NUMBER_NAMES = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];

// ---------------------------------------------------------------------------
// PRIORITY LOGIC
// Each rule below returns zero or more "reasons": { tier, text, sortValue }.
// A ticket's tier is its most urgent reason. sortValue orders tickets inside
// a tier: lower comes first (days left for tier 1, minus days late for tier 2,
// minus days blocked for tier 3).
// ---------------------------------------------------------------------------
const TIER_NAMES = {
  1: "Tier 1: Deadline about to expire",
  2: "Tier 2: Customer let down",
  3: "Tier 3: Blocked on someone else",
  4: "Tier 4: Reply due today",
  5: "Tier 5: On track",
  6: "Resolved",
};
const RESOLVED_TIER = 6;

// Rule 1: every customer gets a reply within 1 business day.
function replyReasons(ticket, today) {
  const last = parseIsoDate(ticket.last_reply_date);
  if (!last) return [{ tier: 5, text: "Rule 1: no last reply date in the data" }];
  if (dayNumber(last) > dayNumber(today)) {
    return [{ tier: 5, text: `Rule 1: last reply date (${formatShortDate(last)}) is after today, so it is ignored` }];
  }
  if (ticket.last_reply_from !== "customer") {
    return [{ tier: 5, text: `Rule 1: no reply owed (we replied last, ${formatShortDate(last)})` }];
  }

  const due = nextBusinessDay(last);
  if (dayNumber(today) < dayNumber(due)) {
    return [{ tier: 5, text: `Rule 1: reply due ${formatDayDate(due)}` }];
  }
  if (dayNumber(today) === dayNumber(due)) {
    return [{ tier: 4, text: `Rule 1: reply due today (${formatShortDate(due)})` }];
  }
  const late = businessDaysAfter(due, today);
  const text = late === 0
    ? `Rule 1: reply overdue (due ${formatDayDate(due)}); 0 business days late so far because today is a weekend`
    : `Rule 1: reply ${plural(late, "business day")} late (due ${formatShortDate(due)})`;
  return [{ tier: 2, text, sortValue: -late }];
}

// Rule 2: refunds for 30 days after delivery, judged by the date the customer asked.
// Also sets ticket.needsManager when the request came after the window.
function refundReasons(ticket, caseInfo, today, result) {
  const delivered = parseIsoDate(ticket.delivered);
  if (!PATTERNS.refund.test(ticket.issue) || !delivered) return [];

  const windowEnd = addDays(delivered, 30);
  const requested = caseInfo.earliestOpened; // assumption: earliest ticket in the case (see Assumption line)

  if (dayNumber(requested) > dayNumber(windowEnd)) {
    result.needsManager = true;
    return [{ tier: 5, text: `Rule 2: refund asked for on ${formatShortDate(requested)}, after the 30-day window ended ${formatShortDate(windowEnd)}. Manager decision needed; do not offer a refund.` }];
  }

  const started = ticket.status === "waiting on warehouse" ||
    PATTERNS.returnStarted.test(ticket.issue) || PATTERNS.returnStarted.test(ticket.notes);
  const daysLeft = daysBetween(today, windowEnd);
  const eligible = `requested ${formatShortDate(requested)}, inside the window`;

  if (started) {
    return [{ tier: 5, text: `Rule 2: refund eligible (${eligible} ending ${formatShortDate(windowEnd)}); return already started` }];
  }
  if (daysLeft >= 0 && daysLeft <= 7) {
    const when = daysLeft === 0 ? "ends TODAY" : daysLeft === 1 ? "ends tomorrow" : `ends in ${daysLeft} days`;
    return [{ tier: 1, text: `Rule 2: refund window ${when} (${formatShortDate(windowEnd)}); ${eligible}, return not started`, sortValue: daysLeft }];
  }
  if (daysLeft > 7) {
    return [{ tier: 5, text: `Rule 2: refund eligible; window ends ${formatShortDate(windowEnd)} (${daysLeft} days left), return not started` }];
  }
  return [{ tier: 5, text: `Rule 2: refund still eligible (${eligible} that ended ${formatShortDate(windowEnd)}); return not started` }];
}

// Rule 3: a carrier damage claim must be filed within 14 days of delivery.
function carrierClaimReasons(ticket, today) {
  const delivered = parseIsoDate(ticket.delivered);
  const isDamage = PATTERNS.damage.test(ticket.issue) || PATTERNS.carrierClaim.test(ticket.notes);
  if (!delivered || !isDamage) return [];
  if (PATTERNS.claimFiled.test(ticket.notes)) return [{ tier: 5, text: "Rule 3: carrier claim filed" }];

  const deadline = addDays(delivered, 14);
  const daysLeft = daysBetween(today, deadline);
  const date = formatShortDate(deadline);
  let text;
  if (daysLeft > 1)        text = `Rule 3: carrier claim deadline is in ${daysLeft} days (${date})`;
  else if (daysLeft === 1) text = `Rule 3: carrier claim deadline is tomorrow (${date})`;
  else if (daysLeft === 0) text = `Rule 3: carrier claim closes TODAY (${date})`;
  else if (daysLeft === -1) text = `Rule 3: carrier claim deadline PASSED yesterday (${date})`;
  else                     text = `Rule 3: carrier claim deadline PASSED ${-daysLeft} days ago (${date})`;
  text += "; claim not filed yet";

  return daysLeft <= 7 ? [{ tier: 1, text, sortValue: daysLeft }] : [{ tier: 5, text }];
}

// A promised date in the issue text that has passed (not a house rule).
function promiseReasons(ticket, today) {
  const match = PATTERNS.promise.exec(ticket.issue);
  const opened = parseIsoDate(ticket.opened);
  if (!match || !opened) return [];
  const month = MONTHS.findIndex(m => m.toLowerCase() === match[2].toLowerCase());
  if (month < 0) return [];

  const thing = match[1].trim();
  const promised = makeDate(opened.getFullYear(), month + 1, Number(match[3])); // year taken from the opened date
  if (dayNumber(today) <= dayNumber(promised)) {
    return [{ tier: 5, text: `Promise: ${thing} promised by ${formatDayDate(promised)} (not passed yet)` }];
  }
  // Late days start on the first business day after the promise (a Saturday promise counts from Monday).
  const late = businessDaysAfter(promised, today);
  const countedFrom = isBusinessDay(promised) ? "" : ` (counted from ${formatDayDate(nextBusinessDay(promised))})`;
  return [{ tier: 2, text: `Promise missed: ${thing} promised by ${formatDayDate(promised)}; ${plural(late, "business day")} late${countedFrom}`, sortValue: -late }];
}

// Blocked on someone else. Only names an owner when the status states one.
function blockedReasons(ticket, today) {
  const ownerMatch = PATTERNS.blockedStatus.exec(ticket.status);
  const stepMatch = PATTERNS.internalStep.exec(ticket.notes);
  if (!ownerMatch && !stepMatch) return [];

  // How long blocked: since the last update in the data, else since the ticket opened.
  const lastReply = parseIsoDate(ticket.last_reply_date);
  const useReply = lastReply && dayNumber(lastReply) <= dayNumber(today);
  const since = useReply ? lastReply : parseIsoDate(ticket.opened);
  const days = Math.max(0, daysBetween(since, today));
  const duration = `${plural(days, "day")} since ${useReply ? "last update" : "the ticket opened"} (${formatShortDate(since)})`;

  let text;
  if (ownerMatch) {
    const owner = ownerMatch[1].toLowerCase();
    text = `Blocked on ${owner} (status: ${ticket.status}), ${duration}.`;
    if (owner === "warehouse" && PATTERNS.refund.test(ticket.issue)) {
      text += " Rule 4: the refund is paid only after the warehouse confirms the returned unit arrived.";
    }
  } else {
    text = `Blocked: ${stepMatch[1].toLowerCase()} not ${stepMatch[2].toLowerCase()} (owner not stated in the data). ${duration[0].toUpperCase()}${duration.slice(1)}.`;
  }
  return [{ tier: 3, text, sortValue: -days }];
}

// Possible firmware issue: firmware 2.4.1 AND stalling words. Never on firmware or amber light alone.
function hasFirmwareIssue(ticket) {
  return ticket.firmware === "2.4.1" && PATTERNS.stalling.test(ticket.issue);
}

// Earlier tickets mentioned in the notes ("Two earlier tickets ..."), or 0.
function earlierTicketCount(ticket) {
  const match = PATTERNS.earlierTickets.exec(ticket.notes);
  if (!match) return 0;
  const word = match[1].toLowerCase();
  return NUMBER_WORDS[word] ?? (Number(word) || 1);
}

// ---------------------------------------------------------------------------
// CASES
// Tickets from the same customer are treated as one case (same name in the
// data). The case is ranked by its most urgent ticket.
// ---------------------------------------------------------------------------
function buildCases(visibleTickets) {
  const byCustomer = new Map();
  visibleTickets.forEach(ticket => {
    const key = ticket.customer.trim().toLowerCase();
    if (!byCustomer.has(key)) byCustomer.set(key, []);
    byCustomer.get(key).push(ticket);
  });

  return [...byCustomer.values()].map(members => ({
    members,
    earliestOpened: members.map(t => parseIsoDate(t.opened)).sort((a, b) => dayNumber(a) - dayNumber(b))[0],
    earlierTickets: Math.max(...members.map(earlierTicketCount)),
  }));
}

// Works out every reason, the tier and the flags for one ticket.
function analyseTicket(ticket, caseInfo, today) {
  const result = { ticket, caseInfo, needsManager: false };
  const reasons = [
    ...carrierClaimReasons(ticket, today),
    ...refundReasons(ticket, caseInfo, today, result),
    ...replyReasons(ticket, today),
    ...promiseReasons(ticket, today),
    ...blockedReasons(ticket, today),
  ];
  reasons.sort((a, b) => a.tier - b.tier);

  if (ticket.status === "resolved") {
    result.tier = RESOLVED_TIER;
    result.sortKey = 0;
  } else {
    result.tier = Math.min(5, ...reasons.map(r => r.tier));
    const inTier = reasons.filter(r => r.tier === result.tier && r.sortValue !== undefined);
    result.sortKey = inTier.length ? Math.min(...inTier.map(r => r.sortValue)) : 0;
  }
  result.reasons = reasons;

  const lastReply = parseIsoDate(ticket.last_reply_date);
  const lastFromCustomer = ticket.last_reply_from === "customer" && lastReply && dayNumber(lastReply) <= dayNumber(today);
  result.lastCustomerDay = lastFromCustomer ? dayNumber(lastReply) : Infinity;

  result.linkedIds = caseInfo.members.filter(t => t !== ticket).map(t => t.ticket_id);
  result.isRepeat = result.linkedIds.length > 0 || earlierTicketCount(ticket) > 0;
  result.firmwareIssue = hasFirmwareIssue(ticket);
  return result;
}

// Order inside the queue: tier, then the tier's own sort, then the tie-breaks
// from CLAUDE.md (repeat customers, oldest last customer message, ticket ID).
function compareTickets(a, b) {
  if (a.tier !== b.tier) return a.tier - b.tier;
  if (a.sortKey !== b.sortKey) return a.sortKey - b.sortKey;
  if (a.isRepeat !== b.isRepeat) return a.isRepeat ? -1 : 1;
  if (a.lastCustomerDay !== b.lastCustomerDay) return a.lastCustomerDay - b.lastCustomerDay;
  return a.ticket.ticket_id.localeCompare(b.ticket.ticket_id);
}

// Builds the queue for a given "today": hides future tickets, groups cases,
// and sorts cases by their most urgent ticket.
function buildQueue(allTickets, today) {
  const visible = allTickets.filter(t => {
    const opened = parseIsoDate(t.opened);
    return !opened || dayNumber(opened) <= dayNumber(today);
  });
  const hiddenCount = allTickets.length - visible.length;

  const cases = buildCases(visible).map(caseInfo => {
    const items = caseInfo.members.map(t => analyseTicket(t, caseInfo, today)).sort(compareTickets);
    caseInfo.needsManager = items.some(item => item.needsManager);
    return { caseInfo, items, lead: items[0] };
  });
  cases.sort((a, b) => compareTickets(a.lead, b.lead));
  return { cases, hiddenCount };
}

// The Assumption line for a case flagged "Needs manager decision", built from the data.
function assumptionText(caseInfo) {
  let text = `Assumption: refund request date taken from earliest ticket in the data (${formatShortDate(caseInfo.earliestOpened)}).`;
  const count = caseInfo.earlierTickets;
  if (count > 0) {
    const name = NUMBER_NAMES[count] || String(count);
    text += ` ${name} earlier ${count === 1 ? "ticket is" : "tickets are"} not in the data; check their dates.`;
  }
  return text;
}

// ---------------------------------------------------------------------------
// APP STATE
// ---------------------------------------------------------------------------
const tickets = rowsToTickets(parseCsv(TICKETS_CSV));
let today = parseIsoDate(DEFAULT_TODAY);

// ---------------------------------------------------------------------------
// RENDERING
// textContent is used everywhere so ticket text can never inject HTML.
// ---------------------------------------------------------------------------

// Small helper: makes an element with optional text and class.
function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function renderToday() {
  document.getElementById("today-picker").value = toIsoDate(today);
  document.getElementById("today-label").textContent = formatLongDate(today);
}

// One ticket: header line, issue, notes, details, flags and reasons.
function renderTicket(item, isLinked) {
  const t = item.ticket;
  const box = el("div", undefined, "ticket" + (isLinked ? " linked" : ""));
  box.dataset.ticketId = t.ticket_id;
  box.dataset.tier = item.tier;

  const title = `${t.ticket_id} · ${t.customer} · ${TIER_NAMES[item.tier]}` + (isLinked ? ` · linked to ${item.linkedIds.join(", ")}` : "");
  box.appendChild(el("strong", title));
  box.appendChild(el("div", `Issue: ${t.issue}`));
  box.appendChild(el("div", `Notes: ${t.notes}`)); // blank notes stay blank
  box.appendChild(el("div",
    `Status: ${t.status} · opened ${t.opened} · delivered ${t.delivered} · ${t.country} · firmware ${t.firmware} · last reply from ${t.last_reply_from} on ${t.last_reply_date}`,
    "muted"));

  const flags = [];
  if (item.isRepeat) {
    flags.push(item.linkedIds.length ? `Repeat customer (linked: ${item.linkedIds.join(", ")})` : "Repeat customer (notes mention earlier tickets)");
  }
  if (item.needsManager) flags.push("Needs manager decision");
  if (item.firmwareIssue) flags.push("Possible firmware issue");
  if (flags.length) box.appendChild(el("div", `Flags: ${flags.join(" · ")}`));

  box.appendChild(el("div", "Reasons:"));
  const list = el("ul");
  item.reasons.forEach(reason => list.appendChild(el("li", reason.text)));
  box.appendChild(list);
  return box;
}

// A case: its lead ticket, then the other tickets in the case directly below.
function renderCase(group) {
  const items = group.items;
  if (items.length === 1 && !group.caseInfo.needsManager) return renderTicket(items[0], false);

  const wrapper = el("div", undefined, "case");
  wrapper.dataset.caseIds = items.map(i => i.ticket.ticket_id).join(",");
  if (items.length > 1) {
    wrapper.appendChild(el("div", `Case: ${items[0].ticket.customer} (${items.map(i => i.ticket.ticket_id).join(", ")}), ranked by ${items[0].ticket.ticket_id}`, "muted"));
  }
  if (group.caseInfo.needsManager) wrapper.appendChild(el("div", assumptionText(group.caseInfo)));
  items.forEach((item, index) => wrapper.appendChild(renderTicket(item, index > 0)));
  return wrapper;
}

function renderQueue() {
  const { cases, hiddenCount } = buildQueue(tickets, today);
  const queue = document.getElementById("queue");
  queue.replaceChildren();

  Object.keys(TIER_NAMES).map(Number).forEach(tier => {
    const inTier = cases.filter(group => group.lead.tier === tier);
    queue.appendChild(el("h2", `${TIER_NAMES[tier]} (${inTier.length})`));
    if (inTier.length === 0) queue.appendChild(el("p", "None.", "muted"));
    inTier.forEach(group => queue.appendChild(renderCase(group)));
  });

  document.getElementById("hidden-note").textContent = hiddenCount === 0 ? ""
    : `${plural(hiddenCount, "ticket")} not yet opened`;
}

// ---------------------------------------------------------------------------
// DATA CHECKS
// Quick checks from CLAUDE.md, shown on the page so they are easy to verify.
// ---------------------------------------------------------------------------
function runDataChecks() {
  const byId = id => tickets.find(t => t.ticket_id === id) || {};
  const checks = [
    ["12 tickets loaded", tickets.length === 12],
    ["every ticket has 11 fields", tickets.every(t => Object.keys(t).length === 11)],
    ["T-102 notes are blank", byId("T-102").notes === ""],
    ["T-101 note keeps its apostrophes", byId("T-101").notes === "Two earlier tickets were closed with 'restart the unit'."],
    ["Oct 5, 2026 is a Monday", formatLongDate(parseIsoDate("2026-10-05")).startsWith("Monday")],
    ["no field says \"undefined\"", tickets.every(t => Object.values(t).every(v => v !== "undefined"))],
  ];
  const failed = checks.filter(([, ok]) => !ok).map(([name]) => name);
  document.getElementById("data-checks").textContent = failed.length === 0
    ? `Data checks: all ${checks.length} passed.`
    : `Data checks FAILED: ${failed.join("; ")}`;
  checks.forEach(([name, ok]) => console.log(ok ? "PASS" : "FAIL", name));
}

// ---------------------------------------------------------------------------
// START
// ---------------------------------------------------------------------------
document.getElementById("today-picker").addEventListener("change", event => {
  const picked = parseIsoDate(event.target.value);
  if (picked) today = picked; // ignore a cleared or invalid picker
  renderToday();
  renderQueue();
});

renderToday();
renderQueue();
runDataChecks();
</script>
</body>
